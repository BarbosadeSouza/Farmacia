<div class="login-container">
  <div class="login-card">

  
    <div class="header">
      <div class="logo">+</div>
      <h2>FarmaVida</h2>
      <p>Acesso ao Sistema Farmacêutico</p>
    </div>

    
    <form (ngSubmit)="fazerLogin()">

      <div class="input-group">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="usuario@farmacia.com"
          required
        />
      </div>

      <div class="input-group">
        <div class="label-row">
          <label for="senha">Senha</label>
   
          <a type="button" class="forgot-link" (click)="esqueciSenha()">Esqueceu a senha?</a>
        </div>
        <input
          type="password"
          id="senha"
          name="senha"
          [(ngModel)]="senha"
          placeholder="••••••••"
          required
        />
   
        <span *ngIf="erroSenha" class="error-message">{{ erroSenha }}</span>
      </div>

      <button type="submit" class="btn-entrar">Entrar</button>

      
      <div class="divider">
        <span>ou</span>
      </div>

      
      <button type="button" class="btn-criar-conta" (click)="criarConta()">Criar nova conta</button>

    </form>

  </div>
</div>
