
<div class="cadastro-container">
  <div class="cadastro-card">

    <h1>FarmaVida</h1>
    <h2>Cadastro de Clientes</h2>

    <p class="descricao">
      Crie sua conta para aproveitar nossos produtos.
    </p>

    <form (ngSubmit)="cadastrar()" #formCadastro="ngForm">

      <label for="nome">Nome completo</label>
      <input
        id="nome"
        type="text"
        name="nome"
        [(ngModel)]="nome"
        placeholder="Digite seu nome"
        required
      />

      <label for="email">E-mail</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Digite seu e-mail"
        required
        email
      />

      <label for="senha">Senha</label>
      <input
        id="senha"
        type="password"
        name="senha"
        [(ngModel)]="senha"
        placeholder="Crie uma senha"
        minlength="8"
        required
      />

      <label for="confirmarSenha">Confirmar senha</label>
      <input
        id="confirmarSenha"
        type="password"
        name="confirmarSenha"
        [(ngModel)]="confirmarSenha"
        placeholder="Digite a senha novamente"
        required
      />

      <button
        type="submit"
        [disabled]="carregando || formCadastro.invalid">
        {{ carregando ? 'Cadastrando...' : 'Cadastrar' }}
      </button>

    </form>

    <p
      *ngIf="mensagem"
      class="mensagem"
      [class.sucesso]="sucesso"
      role="status">
      {{ mensagem }}
    </p>

  </div>
</div>
